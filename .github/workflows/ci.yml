name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The demo depends on the published coordinates rather than the projects,
      # and mavenLocal() is first in dependencyResolutionManagement. Without this
      # the demo would compile against the last release instead of this checkout.
      # Signing is off because the workflow holds no GPG key.
      - name: Publish libraries to mavenLocal
        run: >
          ./gradlew
          :easyandroidpermissions-core:publishToMavenLocal
          :easyandroidpermissions-compose:publishToMavenLocal
          -PenableSigning=false
          --stacktrace

      - name: Check
        run: ./gradlew check --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
